<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EXIF撮影日チェッカー — Ryota Portfolio</title>
<style>
  :root{
    --bg: #0b0c0d;
    --bg-alt: #131416;
    --text: #edeae3;
    --text-dim: #8c8a85;
    --accent: #c9a063;
    --line: #2a2b2d;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    padding: 40px 20px 80px;
  }
  .wrap{ max-width: 820px; margin: 0 auto; }
  h1{ font-size: 1.4rem; margin-bottom: 6px; }
  p.lead{ color: var(--text-dim); font-size: .92rem; margin-top: 0; }

  .dropzone{
    margin-top: 24px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .dropzone.is-drag{ border-color: var(--accent); color: var(--text); }
  .dropzone input{ display: none; }

  .results{ margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .result-row{
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .result-row img{
    width: 56px; height: 56px;
    object-fit: cover;
    border-radius: 6px;
    flex: none;
    background: #000;
  }
  .result-info{ flex: 1; min-width: 0; }
  .result-name{
    font-size: .85rem;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-date{ font-size: 1.05rem; margin-top: 2px; }
  .result-date.is-missing{ color: var(--text-dim); font-size: .9rem; }
  .copy-btn{
    flex: none;
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: .82rem;
    cursor: pointer;
  }
  .copy-btn:hover{ border-color: var(--accent); }
  .copy-btn.is-copied{ color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>EXIF撮影日チェッカー</h1>
  <p class="lead">
    写真をドラッグ&amp;ドロップするか選択すると、EXIFに記録されている撮影日を表示します。
    表示された日付をコピーして、Sveltia CMSの「追加日」欄に貼り付けてください。
    このページはサイトの見た目には影響しない、手元で使うための補助ツールです。
  </p>

  <label class="dropzone" id="dropzone">
    ここに画像をドラッグ&amp;ドロップ、またはクリックして選択(複数可)
    <input type="file" id="file-input" accept="image/*" multiple>
  </label>

  <div class="results" id="results"></div>
</div>

<script type="module">
import * as exifr from 'https://unpkg.com/exifr/dist/full.esm.mjs';

const dropzone = document.getElementById('dropzone');
const input = document.getElementById('file-input');
const results = document.getElementById('results');

dropzone.addEventListener('click', () => input.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('is-drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('is-drag');
  handleFiles(e.dataTransfer.files);
});
input.addEventListener('change', () => handleFiles(input.files));

function formatDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

async function handleFiles(fileList){
  const files = Array.from(fileList || []);
  for(const file of files){
    const row = document.createElement('div');
    row.className = 'result-row';

    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    row.appendChild(img);

    const info = document.createElement('div');
    info.className = 'result-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'result-name';
    nameEl.textContent = file.name;
    info.appendChild(nameEl);

    const dateEl = document.createElement('div');
    dateEl.className = 'result-date';
    dateEl.textContent = '読み込み中...';
    info.appendChild(dateEl);
    row.appendChild(info);

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'コピー';
    btn.disabled = true;
    row.appendChild(btn);

    results.prepend(row);

    try{
      const data = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
      const raw = data && (data.DateTimeOriginal || data.CreateDate);
      if(raw){
        const formatted = formatDate(new Date(raw));
        dateEl.textContent = formatted;
        btn.disabled = false;
        btn.addEventListener('click', async () => {
          try{
            await navigator.clipboard.writeText(formatted);
            btn.textContent = 'コピーしました';
            btn.classList.add('is-copied');
            setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('is-copied'); }, 1600);
          }catch{
            /* クリップボードが使えない環境向けのフォールバックは省略 */
          }
        });
      }else{
        dateEl.textContent = 'EXIFに撮影日が見つかりませんでした';
        dateEl.classList.add('is-missing');
      }
    }catch(err){
      dateEl.textContent = '読み込みに失敗しました';
      dateEl.classList.add('is-missing');
    }
  }
}
</script>
</body>
</html>
